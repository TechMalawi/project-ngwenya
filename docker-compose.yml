name: ngwenya-dev

services:
  #######################
  # Frontend Services
  #######################
  
  # React Router Client - Development Mode
  ngwenya_client:
    container_name: ngwenya_client
    image: node:22-alpine
    working_dir: /usr/src/app
    command: sh -c "npm install && npm run dev"
    restart: always
    ports:
      - "1336:1336"
    volumes:
      - ./client:/usr/src/app
      - client_node_modules:/usr/src/app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_HOST=0.0.0.0
      - VITE_STRAPI_URL=http://ngwenya_server:1337
    networks:
      - ngwenya_network

  #######################
  # Backend Services
  #######################
  
  # Strapi Server - Development Mode
  ngwenya_server:
    container_name: ngwenya_server
    image: node:22-alpine
    working_dir: /usr/src/app
    command: sh -c "npm install && npm run dev"
    restart: always
    ports:
      - "1337:1337"
    volumes:
      - ./server:/usr/src/app
      - server_node_modules:/usr/src/app/node_modules
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=1337
    networks:
      - ngwenya_network
    depends_on:
      - ngwenya_client

volumes:
  client_node_modules:
  server_node_modules:

networks:
  ngwenya_network:
    name: ngwenya_network_dev
    driver: bridge
